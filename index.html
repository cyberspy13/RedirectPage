<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Order Downloaded</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space-deep: #0a0826;
    --ink: #1d1a2e;
    --hugo: #7562aa;
    --hugo-dark: #4e3f80;
    --cream: #fff8e7;
    --accent: #ffd23f;
    --red: #e8262f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
  }

  body {
    background:
      radial-gradient(ellipse 60% 45% at 20% 25%, rgba(155, 89, 255, .35), transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(255, 92, 168, .22), transparent 70%),
      radial-gradient(ellipse 70% 50% at 55% 50%, rgba(56, 120, 255, .25), transparent 75%),
      radial-gradient(ellipse 40% 30% at 10% 85%, rgba(64, 224, 208, .18), transparent 70%),
      linear-gradient(180deg, #120c3d 0%, var(--space-deep) 55%, #050418 100%);
  }

  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .layer { position: fixed; pointer-events: none; }

  /* ---------- Moon ---------- */
  .moon {
    top: 5vh;
    right: 5vw;
    width: clamp(220px, 44vmin, 480px);
    aspect-ratio: 1;
    filter: drop-shadow(0 0 45px rgba(255, 240, 190, .55)) drop-shadow(0 0 110px rgba(255, 230, 160, .25));
    animation: moon-float 9s ease-in-out infinite;
  }
  .moon svg { width: 100%; height: 100%; display: block; }
  .moon.hit { animation: moon-gulp .9s cubic-bezier(.3, 1.6, .5, 1) 1; }

  @keyframes moon-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(10px) rotate(2deg); }
  }
  @keyframes moon-gulp {
    0% { transform: scale(1); }
    30% { transform: scale(1.12, .9); }
    55% { transform: scale(.94, 1.08); }
    100% { transform: scale(1); }
  }

  /* ---------- Planets ---------- */
  .planet { animation: drift 14s ease-in-out infinite; }
  .planet svg { width: 100%; height: auto; display: block; overflow: visible; }
  .saturn { top: 9vh; left: 5vw; width: clamp(120px, 20vmin, 230px); }
  .red-planet { top: 46vh; left: 15vw; width: clamp(48px, 7vmin, 80px); animation-duration: 11s; animation-delay: -3s; }
  .blue-planet { top: 52vh; right: 12vw; width: clamp(70px, 11vmin, 130px); animation-duration: 17s; animation-delay: -6s; }
  .tiny-planet { top: 22vh; left: 42vw; width: clamp(30px, 4.5vmin, 52px); animation-duration: 10s; animation-delay: -2s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(8px, -12px) rotate(3deg); }
    66% { transform: translate(-6px, 6px) rotate(-2deg); }
  }

  /* ---------- Satellite ---------- */
  .satellite {
    top: 30vh;
    left: -160px;
    width: clamp(90px, 12vmin, 140px);
    animation: orbit 38s linear -13s infinite;
  }
  .satellite svg { width: 100%; height: auto; display: block; animation: sat-spin 12s linear infinite; }
  @keyframes orbit {
    0% { transform: translate(0, 0); }
    100% { transform: translate(calc(100vw + 320px), -18vh); }
  }
  @keyframes sat-spin {
    0% { transform: rotate(-12deg); }
    50% { transform: rotate(14deg); }
    100% { transform: rotate(-12deg); }
  }

  /* ---------- Cartoon sparkles ---------- */
  .sparkle {
    width: 22px;
    height: 22px;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  .sparkle svg { width: 100%; height: 100%; display: block; }
  @keyframes twinkle {
    0%, 100% { transform: scale(.4) rotate(0deg); opacity: .4; }
    50% { transform: scale(1) rotate(45deg); opacity: 1; }
  }

  /* ---------- Car ---------- */
  .car {
    position: fixed;
    left: 50%;
    bottom: 2vh;
    width: min(82vw, 500px);
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    will-change: transform;
  }
  .car-inner { animation: hover-bob 2.4s ease-in-out infinite; }
  .car-inner svg { width: 100%; height: auto; display: block; overflow: visible; }
  .car-inner.rumble { animation: rumble .08s linear infinite; }
  .car.flying .car-inner { animation: none; }

  @keyframes hover-bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-12px) rotate(1deg); }
  }
  @keyframes rumble {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-2px, 1px) rotate(-.6deg); }
    50% { transform: translate(2px, -1px) rotate(.6deg); }
    75% { transform: translate(-1px, -2px) rotate(-.3deg); }
    100% { transform: translate(1px, 2px) rotate(.3deg); }
  }

  .hover-glow {
    position: absolute;
    left: 22%;
    right: 12%;
    bottom: -6px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255, 170, 60, .45), transparent 70%);
    filter: blur(4px);
    animation: glow-pulse 2.4s ease-in-out infinite;
  }
  .car.flying .hover-glow { display: none; }
  @keyframes glow-pulse {
    0%, 100% { opacity: .9; transform: scaleX(1); }
    50% { opacity: .45; transform: scaleX(.8); }
  }

  /* ---------- Dialog ---------- */
  .dialog-wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    z-index: 10;
  }
  .dialog {
    width: min(100%, 440px);
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 28px;
    padding: 28px 28px 26px;
    text-align: center;
    box-shadow: 10px 12px 0 rgba(10, 6, 40, .85), 0 0 60px rgba(160, 120, 255, .45);
    animation: pop-in .7s cubic-bezier(.3, 1.6, .5, 1) both;
    position: relative;
  }
  .dialog.closing { animation: pop-out .35s cubic-bezier(.6, -0.4, .7, 1) forwards; }

  @keyframes pop-in {
    0% { transform: scale(.3) rotate(-8deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes pop-out {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(.2) rotate(10deg); opacity: 0; }
  }

  .doc-icon {
    width: 86px;
    height: 86px;
    margin: -76px auto 10px;
    filter: drop-shadow(4px 5px 0 rgba(10, 6, 40, .8));
    animation: icon-wiggle 3s ease-in-out infinite;
  }
  @keyframes icon-wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg) translateY(-4px); }
  }

  .dialog h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 5.5vw, 28px);
    font-weight: 700;
    line-height: 1.2;
  }
  .dialog p {
    margin: 0 0 22px;
    font-size: clamp(16px, 4.2vw, 19px);
    color: #4a4560;
  }

  .ok-btn {
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--ink);
    background: var(--accent);
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 10px 46px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--ink);
    transition: transform .1s, box-shadow .1s, background .2s;
  }
  .ok-btn:hover { background: #ffe066; transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
  .ok-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .ok-btn:focus-visible { outline: 4px solid #8fd3ff; outline-offset: 4px; }

  /* ---------- Flight effects ---------- */
  .puff {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #d9d4f0 60%, #a79fd0);
    border: 3px solid rgba(29, 26, 46, .55);
    pointer-events: none;
    z-index: 4;
    animation: puff 1.1s ease-out forwards;
  }
  @keyframes puff {
    0% { transform: translate(-50%, -50%) scale(.3); opacity: .95; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }

  .burst {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 6;
  }
  .burst .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40px;
    height: 40px;
    border: 6px solid #fff6c8;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: ring 0.9s ease-out forwards;
  }
  .burst .ray {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    animation: ray 1s ease-out forwards;
  }
  @keyframes ring {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 240px; height: 240px; opacity: 0; border-width: 1px; }
  }
  @keyframes ray {
    0% { transform: rotate(var(--a)) translateX(0) scale(.4); opacity: 1; }
    100% { transform: rotate(var(--a)) translateX(140px) scale(1.1) rotate(180deg); opacity: 0; }
  }

  .farewell {
    position: fixed;
    left: 0;
    right: 0;
    margin-inline: auto;
    bottom: 8vh;
    z-index: 10;
    background: rgba(255, 248, 231, .95);
    border: 4px solid var(--ink);
    border-radius: 20px;
    padding: 12px 24px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 600;
    text-align: center;
    width: max-content;
    max-width: calc(100vw - 32px);
    box-shadow: 6px 7px 0 rgba(10, 6, 40, .85);
    animation: pop-in .6s cubic-bezier(.3, 1.6, .5, 1) both;
  }

  @media (prefers-reduced-motion: reduce) {
    .planet, .satellite, .satellite svg, .sparkle, .moon, .car-inner, .doc-icon { animation-duration: 60s; }
  }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<!-- Planets -->
<div class="layer planet saturn" aria-hidden="true">
  <svg viewBox="0 0 200 140">
    <defs>
      <radialGradient id="satG" cx="38%" cy="35%" r="70%">
        <stop offset="0" stop-color="#ffd59a"/>
        <stop offset=".6" stop-color="#f5a04f"/>
        <stop offset="1" stop-color="#c8612c"/>
      </radialGradient>
      <clipPath id="satClip"><circle cx="100" cy="70" r="42"/></clipPath>
    </defs>
    <g transform="rotate(-18 100 70)">
      <ellipse cx="100" cy="70" rx="92" ry="23" fill="none" stroke="#1d1a2e" stroke-width="16"/>
      <ellipse cx="100" cy="70" rx="92" ry="23" fill="none" stroke="#f9dc94" stroke-width="9"/>
      <circle cx="100" cy="70" r="42" fill="url(#satG)" stroke="#1d1a2e" stroke-width="4"/>
      <g clip-path="url(#satClip)" opacity=".55">
        <path d="M50,58 Q100,48 150,58" stroke="#c8612c" stroke-width="7" fill="none"/>
        <path d="M50,80 Q100,90 150,80" stroke="#ffe0ad" stroke-width="6" fill="none"/>
        <path d="M50,94 Q100,104 150,94" stroke="#c8612c" stroke-width="5" fill="none"/>
      </g>
      <path d="M72,50 Q80,40 92,38" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>
      <path d="M8,70 A92,23 0 0,0 192,70" fill="none" stroke="#1d1a2e" stroke-width="16"/>
      <path d="M8,70 A92,23 0 0,0 192,70" fill="none" stroke="#f9dc94" stroke-width="9"/>
      <path d="M30,80 A80,16 0 0,0 170,80" fill="none" stroke="#e8b85c" stroke-width="2.5"/>
    </g>
  </svg>
</div>

<div class="layer planet red-planet" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <defs>
      <radialGradient id="redG" cx="35%" cy="32%" r="70%">
        <stop offset="0" stop-color="#ff9a8b"/>
        <stop offset=".6" stop-color="#e5484d"/>
        <stop offset="1" stop-color="#9c2343"/>
      </radialGradient>
    </defs>
    <circle cx="50" cy="50" r="44" fill="url(#redG)" stroke="#1d1a2e" stroke-width="5"/>
    <circle cx="62" cy="40" r="8" fill="#c23a4a" stroke="#7d1d33" stroke-width="2"/>
    <circle cx="40" cy="64" r="6" fill="#c23a4a" stroke="#7d1d33" stroke-width="2"/>
    <circle cx="66" cy="66" r="4" fill="#c23a4a"/>
    <path d="M24,38 Q30,24 44,20" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>
  </svg>
</div>

<div class="layer planet blue-planet" aria-hidden="true">
  <svg viewBox="0 0 140 140">
    <defs>
      <radialGradient id="blueG" cx="35%" cy="32%" r="72%">
        <stop offset="0" stop-color="#9ef0e3"/>
        <stop offset=".55" stop-color="#3fb6c9"/>
        <stop offset="1" stop-color="#2b4fa8"/>
      </radialGradient>
      <clipPath id="blueClip"><circle cx="70" cy="70" r="48"/></clipPath>
    </defs>
    <circle cx="70" cy="70" r="48" fill="url(#blueG)" stroke="#1d1a2e" stroke-width="5"/>
    <g clip-path="url(#blueClip)" fill="none" stroke-linecap="round" opacity=".7">
      <path d="M20,56 C45,46 60,66 90,54 S120,50 125,48" stroke="#e8fffb" stroke-width="5"/>
      <path d="M18,82 C40,92 70,74 96,86 S118,90 124,88" stroke="#2b6cb0" stroke-width="6"/>
      <circle cx="88" cy="96" r="7" fill="#7be0b0" stroke="none"/>
      <circle cx="46" cy="40" r="5" fill="#7be0b0" stroke="none"/>
    </g>
    <path d="M38,44 Q46,30 60,26" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="9s" repeatCount="indefinite"/>
      <circle cx="132" cy="70" r="8" fill="#e6e1f5" stroke="#1d1a2e" stroke-width="3"/>
    </g>
  </svg>
</div>

<div class="layer planet tiny-planet" aria-hidden="true">
  <svg viewBox="0 0 60 60">
    <circle cx="30" cy="30" r="22" fill="#c59bff" stroke="#1d1a2e" stroke-width="4"/>
    <circle cx="36" cy="24" r="5" fill="#a275ee"/>
    <circle cx="24" cy="38" r="3.5" fill="#a275ee"/>
    <path d="M18,22 Q22,14 30,12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>
  </svg>
</div>

<!-- Satellite -->
<div class="layer satellite" aria-hidden="true">
  <svg viewBox="0 0 160 90">
    <g stroke="#1d1a2e" stroke-width="3" stroke-linejoin="round">
      <line x1="40" y1="45" x2="62" y2="45"/>
      <line x1="98" y1="45" x2="120" y2="45"/>
      <rect x="4" y="28" width="38" height="34" rx="3" fill="#3d6fe0"/>
      <rect x="118" y="28" width="38" height="34" rx="3" fill="#3d6fe0"/>
      <path d="M17,28 V62 M30,28 V62 M4,45 H42 M131,28 V62 M144,28 V62 M118,45 H156" stroke="#9ec4ff" stroke-width="1.5"/>
      <rect x="60" y="30" width="40" height="32" rx="6" fill="#f2c14e"/>
      <path d="M66,36 H94" stroke="#fff3c4" stroke-width="3" stroke-linecap="round"/>
      <path d="M80,30 L80,16" />
      <path d="M68,62 Q80,82 92,62 Z" fill="#e6e1f5"/>
      <line x1="80" y1="70" x2="80" y2="78"/>
    </g>
    <circle cx="80" cy="13" r="4.5" fill="#ff4d5e" stroke="#1d1a2e" stroke-width="2">
      <animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </svg>
</div>

<!-- Moon -->
<div class="layer moon" id="moon" aria-hidden="true">
  <svg viewBox="0 0 200 200">
    <defs>
      <radialGradient id="moonG" cx="36%" cy="34%" r="72%">
        <stop offset="0" stop-color="#fffdf2"/>
        <stop offset=".55" stop-color="#f3e9c6"/>
        <stop offset="1" stop-color="#d4c597"/>
      </radialGradient>
      <radialGradient id="moonShade" cx="85%" cy="80%" r="75%">
        <stop offset="0" stop-color="#5b4a8a" stop-opacity=".38"/>
        <stop offset=".6" stop-color="#5b4a8a" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="moonClip"><circle cx="100" cy="100" r="92"/></clipPath>
    </defs>
    <circle cx="100" cy="100" r="92" fill="url(#moonG)"/>
    <g clip-path="url(#moonClip)">
      <g fill="#e2d4a8" stroke="#bfae7d" stroke-width="2.5">
        <circle cx="68" cy="62" r="17"/>
        <circle cx="130" cy="48" r="10"/>
        <circle cx="142" cy="110" r="22"/>
        <circle cx="78" cy="132" r="13"/>
        <circle cx="108" cy="88" r="7"/>
        <circle cx="46" cy="104" r="8"/>
        <circle cx="116" cy="158" r="9"/>
        <circle cx="168" cy="74" r="6"/>
      </g>
      <g fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" opacity=".85">
        <path d="M58,52 Q64,47 72,48"/>
        <path d="M128,94 Q136,88 146,90"/>
        <path d="M71,124 Q76,120 82,121"/>
        <path d="M125,42 Q129,39 134,40"/>
      </g>
      <circle cx="100" cy="100" r="92" fill="url(#moonShade)"/>
    </g>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#3b2f52" stroke-width="4"/>
    <path d="M40,58 Q52,30 84,20" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8"/>
  </svg>
</div>

<!-- Cartoon sparkles -->
<div id="sparkles" aria-hidden="true"></div>

<!-- Car: Roadster with Hugo the bear -->
<div class="car" id="car" aria-hidden="true">
  <div class="car-inner" id="carInner">
    <svg viewBox="-150 -10 550 190">
      <defs>
        <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff6b6f"/>
          <stop offset=".45" stop-color="#e8262f"/>
          <stop offset="1" stop-color="#9e0f1a"/>
        </linearGradient>
        <linearGradient id="metalG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f5fb"/>
          <stop offset=".5" stop-color="#b9bdcf"/>
          <stop offset="1" stop-color="#6f7390"/>
        </linearGradient>
        <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffb347" stop-opacity=".7"/>
          <stop offset="1" stop-color="#ff5e1a" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="bodyClip">
          <path d="M30,122 C27,104 36,92 60,88 L128,84 C140,72 160,70 174,82 L270,84 C330,86 368,94 382,106 C392,116 388,134 370,136 L44,136 C34,136 31,130 30,122 Z"/>
        </clipPath>
      </defs>

      <!-- Rocket flames (nozzle at -24,103) -->
      <g transform="translate(-24,103)">
        <g id="boost">
          <ellipse cx="-55" cy="0" rx="90" ry="34" fill="url(#flameGlow)">
            <animate attributeName="ry" values="34;28;36;34" dur=".3s" repeatCount="indefinite"/>
          </ellipse>
          <path d="M0,-17 C-40,-22 -88,-9 -122,0 C-88,9 -40,22 0,17 Z" fill="#ff6a1c" stroke="#1d1a2e" stroke-width="3" stroke-linejoin="round">
            <animateTransform attributeName="transform" type="scale" values="1 1;1.14 .88;.92 1.06;1 1" dur=".22s" repeatCount="indefinite"/>
          </path>
          <path d="M0,-12 C-30,-14 -62,-5 -86,0 C-62,5 -30,14 0,12 Z" fill="#ffc93c">
            <animateTransform attributeName="transform" type="scale" values="1 1;.88 1.08;1.1 .92;1 1" dur=".17s" repeatCount="indefinite"/>
          </path>
          <path d="M0,-6 C-18,-7 -36,-3 -50,0 C-36,3 -18,7 0,6 Z" fill="#fffbe0">
            <animateTransform attributeName="transform" type="scale" values="1 1;1.15 1;.9 1;1 1" dur=".13s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>

      <!-- Rear headrest -->
      <rect x="168" y="58" width="16" height="30" rx="7" fill="#3b1726" stroke="#1d1a2e" stroke-width="4"/>

      <!-- Hugo the bear -->
      <g stroke="#2b2150" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <!-- scarf tail -->
        <path fill="#ffd23f" d="M204,58 C190,52 176,60 160,52 C168,62 156,70 146,66 C164,76 186,70 206,68 Z">
          <animate attributeName="d" dur=".6s" repeatCount="indefinite"
            values="M204,58 C190,52 176,60 160,52 C168,62 156,70 146,66 C164,76 186,70 206,68 Z;
                    M204,58 C190,56 176,50 160,58 C168,66 156,62 146,72 C164,74 186,72 206,68 Z;
                    M204,58 C190,52 176,60 160,52 C168,62 156,70 146,66 C164,76 186,70 206,68 Z"/>
        </path>

        <!-- waving arm (behind body) -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-14 200 66;16 200 66;-14 200 66" dur="1.1s" repeatCount="indefinite"/>
          <path d="M198,70 C188,54 182,38 184,22" fill="none" stroke="#2b2150" stroke-width="20"/>
          <path d="M198,70 C188,54 182,38 184,22" fill="none" stroke="#7562aa" stroke-width="12"/>
          <circle cx="184" cy="17" r="10" fill="#7562aa"/>
          <path d="M179,12 L180,8 M185,10 L185,6 M190,12 L192,9" stroke-width="2.5"/>
        </g>

        <!-- torso -->
        <ellipse cx="214" cy="76" rx="25" ry="25" fill="#7562aa"/>
        <ellipse cx="222" cy="80" rx="12" ry="14" fill="#9d8cd0" stroke="none"/>
        <!-- scarf collar -->
        <path d="M196,60 Q214,70 234,58 L236,66 Q214,80 196,68 Z" fill="#ffd23f"/>

          <line x1="0" y1="-12" x2="0" y2="12"/><line x1="-12" y1="0" x2="12" y2="0"/>
          <line x1="-8" y1="-8" x2="8" y2="8"/><line x1="-8" y1="8" x2="8" y2="-8"/>

<!-- Message -->
<div class="dialog-wrap" id="dialogWrap">
  <div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgText">
    <svg class="doc-icon" viewBox="0 0 90 90" aria-hidden="true">
      <path d="M18,6 H56 L74,24 V82 Q74,86 70,86 H18 Q14,86 14,82 V10 Q14,6 18,6 Z" fill="#fff" stroke="#1d1a2e" stroke-width="5" stroke-linejoin="round"/>
      <path d="M56,6 V24 H74" fill="#e6e1f5" stroke="#1d1a2e" stroke-width="5" stroke-linejoin="round"/>
      <path d="M26,34 H58 M26,44 H52 M26,54 H46" stroke="#b9b3d6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="62" cy="66" r="18" fill="#3ccf7a" stroke="#1d1a2e" stroke-width="5"/>
      <path d="M53,66 L60,73 L72,59" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 id="dlgTitle">Purchase Order downloaded.</h1>
    <p id="dlgText">Session will be closed.</p>
    <button class="ok-btn" id="okBtn" type="button">OK</button>
  </div>
</div>

<script>
(function () {
  // ---------- Starfield + comets ----------
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, stars = [], comets = [];
  const starColors = ['#ffffff', '#fff4c9', '#cfe3ff', '#f3d9ff'];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round((W * H) / 3500);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.3,
      c: starColors[(Math.random() * starColors.length) | 0],
      p: Math.random() * Math.PI * 2,
      s: Math.random() * 2 + 0.6
    }));
  }

  function spawnComet() {
    const fromTop = Math.random() < 0.6;
    const speed = 7 + Math.random() * 6;
    const angle = (Math.PI * (0.72 + Math.random() * 0.12)); // heading down-left
    comets.push({
      x: fromTop ? W * (0.3 + Math.random() * 0.7) : W + 20,
      y: fromTop ? -20 : Math.random() * H * 0.5,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: 120 + Math.random() * 140,
      r: 3 + Math.random() * 2.5,
      hue: Math.random() < 0.5 ? '255,236,170' : '170,220,255'
    });
    setTimeout(spawnComet, 1800 + Math.random() * 3200);
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = 0.45 + 0.55 * Math.abs(Math.sin(t / 1000 * s.s + s.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i = comets.length - 1; i >= 0; i--) {
      const c = comets[i];
      c.x += c.vx;
      c.y += c.vy;
      const sp = Math.hypot(c.vx, c.vy);
      const tx = c.x - (c.vx / sp) * c.len;
      const ty = c.y - (c.vy / sp) * c.len;
      const g = ctx.createLinearGradient(c.x, c.y, tx, ty);
      g.addColorStop(0, `rgba(${c.hue},.95)`);
      g.addColorStop(1, `rgba(${c.hue},0)`);
      ctx.strokeStyle = g;
      ctx.lineCap = 'round';
      ctx.lineWidth = c.r * 2;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.shadowColor = `rgba(${c.hue},1)`;
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r + 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (c.x < -c.len || c.y > H + c.len) comets.splice(i, 1);
    }
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(draw);
  setTimeout(spawnComet, 600);

  // ---------- Cartoon sparkles ----------
  const sparkleHost = document.getElementById('sparkles');
  const sparkleSpots = [[12, 30], [30, 12], [58, 8], [70, 40], [88, 62], [8, 64], [38, 70], [62, 78], [92, 30], [24, 86], [50, 34]];
  sparkleSpots.forEach(([x, y], i) => {
    const el = document.createElement('div');
    el.className = 'layer sparkle';
    el.style.left = x + 'vw';
    el.style.top = y + 'vh';
    el.style.animationDelay = (-i * 0.37) + 's';
    const size = 14 + (i % 3) * 7;
    el.style.width = el.style.height = size + 'px';
    el.innerHTML = '<svg viewBox="-12 -12 24 24"><path d="M0,-11 Q2,-2 11,0 Q2,2 0,11 Q-2,2 -11,0 Q-2,-2 0,-11Z" fill="#fff6c2" stroke="#1d1a2e" stroke-width="1.5"/></svg>';
    sparkleHost.appendChild(el);
  });

  // ---------- Launch sequence ----------
  const okBtn = document.getElementById('okBtn');
  const dialog = document.getElementById('dialog');
  const dialogWrap = document.getElementById('dialogWrap');
  const car = document.getElementById('car');
  const carInner = document.getElementById('carInner');
  const boost = document.getElementById('boost');
  const moon = document.getElementById('moon');

  okBtn.focus();
  okBtn.addEventListener('click', launch, { once: true });

  function setBoost(sx, sy) {
    boost.setAttribute('transform', `scale(${sx} ${sy})`);
  }

  function launch() {
    dialog.classList.add('closing');
    setTimeout(() => { dialogWrap.style.display = 'none'; }, 360);

    // Ignition: rumble and flames grow
    carInner.classList.add('rumble');
    setBoost(1.5, 1.2);
    setTimeout(() => setBoost(2.1, 1.4), 450);
    setTimeout(fly, 950);
  }

  function center(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, left: r.left, top: r.top };
  }

  function bezier(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
  }
  function bezierD(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return 3 * u * u * (p1 - p0) + 6 * u * t * (p2 - p1) + 3 * t * t * (p3 - p2);
  }

  function fly() {
    carInner.classList.remove('rumble');
    const c = center(car);
    const m = center(moon);

    // Pin the car where it is, then drive it with transforms
    car.classList.add('flying');
    car.style.left = c.left + 'px';
    car.style.top = c.top + 'px';
    car.style.bottom = 'auto';
    car.style.width = c.w + 'px';
    car.style.transform = 'none';

    const vw = window.innerWidth, vh = window.innerHeight;
    const P0 = { x: c.x, y: c.y };
    const P3 = { x: m.x, y: m.y };
    const P1 = { x: P0.x + (P3.x - P0.x) * 0.55 + vw * 0.08, y: P0.y - vh * 0.06 };
    const P2 = { x: P3.x - (P3.x - P0.x) * 0.15 - vw * 0.12, y: P3.y + (P0.y - P3.y) * 0.45 };

    const duration = 3200;
    const start = performance.now();
    let lastPuff = 0;

    function frame(now) {
      const raw = Math.min((now - start) / duration, 1);
      const t = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
      const x = bezier(P0.x, P1.x, P2.x, P3.x, t);
      const y = bezier(P0.y, P1.y, P2.y, P3.y, t);
      const dx = bezierD(P0.x, P1.x, P2.x, P3.x, Math.max(t, 0.02));
      const dy = bezierD(P0.y, P1.y, P2.y, P3.y, Math.max(t, 0.02));
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      const scale = 1 - 0.94 * Math.pow(t, 0.9);

      car.style.transform = `translate(${x - P0.x}px, ${y - P0.y}px) rotate(${ang}deg) scale(${scale})`;
      car.style.opacity = raw > 0.88 ? String(Math.max(0, 1 - (raw - 0.88) / 0.12)) : '1';

      // Smoke puffs behind the booster
      if (now - lastPuff > 45 && raw < 0.9) {
        lastPuff = now;
        const rad = ang * Math.PI / 180;
        const back = c.w * 0.42 * scale;
        spawnPuff(x - Math.cos(rad) * back, y - Math.sin(rad) * back, (18 + Math.random() * 22) * Math.max(scale, 0.25));
      }

      if (raw < 1) {
        requestAnimationFrame(frame);
      } else {
        arrive(P3);
      }
    }
    requestAnimationFrame(frame);
  }

  function spawnPuff(x, y, size) {
    const p = document.createElement('div');
    p.className = 'puff';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.width = p.style.height = size + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1150);
  }

  function arrive(pt) {
    car.style.display = 'none';
    moon.classList.add('hit');

    const burst = document.createElement('div');
    burst.className = 'burst';
    burst.style.left = (pt.x - 5) + 'px';
    burst.style.top = (pt.y - 5) + 'px';
    let html = '<div class="ring"></div>';
    for (let i = 0; i < 10; i++) {
      html += `<div class="ray" style="--a:${i * 36}deg"><svg viewBox="-12 -12 24 24" width="26" height="26"><path d="M0,-11 Q2,-2 11,0 Q2,2 0,11 Q-2,2 -11,0 Q-2,-2 0,-11Z" fill="${i % 2 ? '#ffd23f' : '#fff6c2'}" stroke="#1d1a2e" stroke-width="1.5"/></svg></div>`;
    }
    burst.innerHTML = html;
    document.body.appendChild(burst);
    setTimeout(() => burst.remove(), 1200);

    setTimeout(() => {
      const bye = document.createElement('div');
      bye.className = 'farewell';
      bye.setAttribute('role', 'status');
      bye.textContent = 'Session closed. Hugo has landed safely on the Moon!';
      document.body.appendChild(bye);
      // Only works if this tab was opened by a script; otherwise the message stays.
      setTimeout(() => { try { window.close(); } catch (e) {} }, 1800);
    }, 900);
  }
})();
</script>
